# =====================================================================
# APPLICATION.PROPERTIES - ARCHIVO DE CONFIGURACION DE SPRING BOOT
# Es el "panel de control" de la aplicacion backend.
# Spring Boot lee este archivo al arrancar y configura todo segun los valores que encuentra aqui.
# Formato: clave=valor - cada linea le dice algo a Spring Boot
# =====================================================================


# =====================================================================
# NOMBRE DE LA APLICACION
# Identificador interno de la aplicacion. Se usa en logs y metricas.
# =====================================================================
spring.application.name=employee_information_management


# =====================================================================
# CONEXION A LA BASE DE DATOS MYSQL
# Le dice a Spring Boot donde esta MySQL y como conectarse
# =====================================================================

# URL de conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_company
# jdbc:mysql - protocolo de conexion
# localhost - la base de datos esta en este mismo ordenador
# 3306 - puerto por defecto de MySQL
# db_company - nombre de la base de datos

# Usuario de MySQL con el que se conecta Spring Boot / PENDIENTE DE CAMBIAR
spring.datasource.username=root

# Contrasena del usuario de MySQL / PENDIENTE DE CAMBIAR
spring.datasource.password=putosql1

# Driver JDBC que usa Spring Boot para hablar con MySQL
# Es como el "traductor" entre Java y MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================================
# CONFIGURACION DE JPA/HIBERNATE
# JPA es la capa que conecta los objetos Java con las tablas de MySQL
# Hibernate es la implementacion de JPA que usa Spring Boot
# Evita que Hibernate cree o modifique automaticamente la base de datos
# =====================================================================

# Le dice a Hibernate que hacer con las tablas al arrancar
spring.jpa.hibernate.ddl-auto=none
# none - no toques las tablas, ya las creo yo en MySQL
# create - crea las tablas al arrancar (borra los datos existentes)
# update - actualiza las tablas si hay cambios en las entidades
# validate - solo comprueba que las tablas coinciden con las entidades

# true - muestra en la consola de IntelliJ las consultas SQL que ejecuta Hibernate
# Util para depuracion
spring.jpa.show-sql=true
# false - no muestra las consultas


# =====================================================================
# TIPO DE APLICACION WEB
# Le dice a Spring Boot si debe arrancar un servidor web o no
# =====================================================================

# servlet - activa Tomcat para escuchar peticiones HTTP
spring.main.web-application-type=servlet
# none - desactiva el servidor web completamente
# reactive - activa un servidor web reactivo (no necesario aqui)
# Sin Tomcat activo el frontend no puede enviar peticiones al backend

